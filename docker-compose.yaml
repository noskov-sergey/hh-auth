version: '3'

volumes:
  postgres_volume:

services:
  db:
    image: postgres:14-alpine
    environment:
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
    ports:
      - "5438:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql/data

  migrator:
   build:
     context: .
     dockerfile: migration.Dockerfile
   restart: on-failure
   env_file:
     - .env.example
